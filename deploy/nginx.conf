# Client IP, in two hops. Every request reaches nginx from Coolify's Traefik
# on a private Docker address, so first take the address Traefik saw from
# X-Forwarded-For — trusted only from those ranges, and walked right to left
# so a value the client typed into the header is never picked.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# If that address is a Cloudflare edge, the visitor is in CF-Connecting-IP,
# which Cloudflare always overwrites. From anywhere else the header is
# ignored, so hitting the origin directly can't spoof it.
# Source: https://www.cloudflare.com/ips/ (checked 2026-10-05).
geo $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$from_cloudflare:$http_cf_connecting_ip" $client_ip {
    "~^1:(?<cf_ip>[0-9A-Fa-f.:]+)$" $cf_ip;
    default $remote_addr;
}

# An empty key is never limited: keeps the health check out of the limit.
map $uri $rate_limit_key {
    /healthz "";
    default $client_ip;
}

# Sized for a classroom behind one university NAT: ~40 students opening the
# app together is ~400 requests from a single IP within seconds. Still
# stops a single-source flood; volumetric attacks are Cloudflare's job.
limit_req_zone $rate_limit_key zone=per_ip:10m rate=50r/s;
limit_conn_zone $rate_limit_key zone=conn_per_ip:10m;

log_format client '$client_ip - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log client;

    server_tokens off;
    # Redirects must not leak the internal port or scheme behind Traefik.
    absolute_redirect off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    limit_req zone=per_ip burst=400 nodelay;
    limit_conn conn_per_ip 200;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    # Hashed file names: safe to cache forever. A missing asset must 404
    # rather than fall back to index.html and be parsed as JS/CSS.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
